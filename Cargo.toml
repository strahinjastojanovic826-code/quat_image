[package]
name = "quat_image"
version = "0.5.0"
edition = "2024"
authors = ["Strale <strahinjastojanovic826@gmail.com>"] 
description = "A high-performance Rust library for packing 4 pixels (2 bits each) into a single byte with FFI support."
license = "AGPL-3.0-only"                     
readme = "README.md"               
repository = "https://github.com/strahinjastojanovic826-code/quat_image" 
keywords = ["image", "pixel", "packing", "ffi", "compression"]
categories = ["data-structures", "compression", "external-ffi-bindings"] 

[lib]
name = "quat_image"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
rayon = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
